services:
  foliotrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foliotrack
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Rome
      - DB_PATH=/app/data/foliotrack.db
      - BACKUP_DIR=/app/data/backups
      - JWT_SECRET=foliotrack_super_secret_jwt_change_in_production_ugos_nas
      # - TELEGRAM_BOT_TOKEN=your_bot_token_here
      # - TELEGRAM_CHAT_ID=your_chat_id_here
      # - GEMINI_API_KEY=your_gemini_api_key
      # - OPENAI_API_KEY=your_openai_api_key
      # - TAVILY_API_KEY=your_tavily_api_key
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

