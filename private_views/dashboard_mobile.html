<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FolioTrack Mobile</title>
  
  <!-- Anti-FOUC Theme Script -->
  <script src="/theme.js"></script>

  <!-- Typography & CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dist/style.css">

  <!-- GridStack.js CSS -->
  <link rel="stylesheet" href="/vendor/gridstack/gridstack.min.css">

  <style>
    /* 2-Column Responsive GridStack layout for mobile */
    .grid-stack.gs-2 > .grid-stack-item:not(.ui-draggable-dragging),
    .grid-stack-2 > .grid-stack-item:not(.ui-draggable-dragging) {
      width: 50% !important;
    }
    .grid-stack.gs-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-w="1"],
    .grid-stack-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-w="1"] {
      width: 50% !important;
    }
    .grid-stack.gs-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-w="2"],
    .grid-stack-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-w="2"] {
      width: 100% !important;
    }
    .grid-stack.gs-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-x="0"],
    .grid-stack-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-x="0"] {
      left: 0% !important;
    }
    .grid-stack.gs-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-x="1"],
    .grid-stack-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-x="1"] {
      left: 50% !important;
    }

    /* Mobile compact & homogeneous card styling */
    .grid-stack > .grid-stack-item > .grid-stack-item-content {
      border-radius: 0.875rem;
    }
    .grid-stack > .grid-stack-item .signature-card {
      padding: 0.75rem 0.65rem !important;
      border-radius: 0.875rem;
      font-family: var(--ft-widget-font-family, 'Inter', sans-serif);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Homogeneous scaled typography for 1-column KPI cards on mobile */
    .grid-stack-item[gs-w="1"] .signature-card {
      padding: 0.7rem 0.6rem !important;
    }
    .grid-stack-item[gs-w="1"] .signature-card .text-2xl,
    .grid-stack-item[gs-w="1"] .signature-card .text-3xl {
      font-size: calc(1.25rem * var(--ft-widget-font-scale, 1)) !important;
      line-height: 1.35 !important;
    }
    .grid-stack-item[gs-w="1"] .signature-card .text-xs {
      font-size: calc(0.72rem * var(--ft-widget-font-scale, 1)) !important;
    }
    .grid-stack-item[gs-w="1"] .signature-card .text-\[11px\],
    .grid-stack-item[gs-w="1"] .signature-card .text-\[10px\] {
      font-size: calc(0.65rem * var(--ft-widget-font-scale, 1)) !important;
    }

    /* Homogeneous scaled typography for 2-column cards on mobile */
    .grid-stack-item[gs-w="2"] .signature-card .text-3xl {
      font-size: calc(1.65rem * var(--ft-widget-font-scale, 1)) !important;
      line-height: 1.3 !important;
    }
    .grid-stack-item[gs-w="2"] .signature-card .text-2xl {
      font-size: calc(1.35rem * var(--ft-widget-font-scale, 1)) !important;
      line-height: 1.35 !important;
    }
    .grid-stack-item[gs-w="2"] .signature-card .text-xs {
      font-size: calc(0.75rem * var(--ft-widget-font-scale, 1)) !important;
    }
    .grid-stack-item[gs-w="2"] .signature-card .text-\[11px\],
    .grid-stack-item[gs-w="2"] .signature-card .text-\[10px\] {
      font-size: calc(0.68rem * var(--ft-widget-font-scale, 1)) !important;
    }

    /* Common widget elements normalization on mobile */
    .grid-stack .signature-card button,
    .grid-stack .signature-card select,
    .grid-stack .signature-card input {
      font-family: inherit;
    }

    /* Performance chart specific mobile responsive optimizations */
    .grid-stack-item[gs-id="performanceChart"] .signature-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #chart-performance {
      width: 100% !important;
      height: 100% !important;
      max-height: 100% !important;
    }

    /* Ultra-compact categoryQuotes & performanceMatrix widget row density */
    .grid-stack-item[gs-id="categoryQuotes"] .signature-card,
    .grid-stack-item[gs-id="categoryGains"] .signature-card,
    .grid-stack-item[gs-id="performanceMatrix"] .signature-card {
      padding: 0.5rem 0.35rem !important;
    }
    .grid-stack-item[gs-id="categoryQuotes"] .category-block,
    .grid-stack-item[gs-id="categoryGains"] .category-block {
      margin-bottom: 0 !important;
    }

    /* Hero Portfolio Value (gs-id="value") compact 3-column optimization on mobile */
    .grid-stack.gs-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-id="value"],
    .grid-stack-2 > .grid-stack-item:not(.ui-draggable-dragging)[gs-id="value"] {
      width: 100% !important;
    }
    .grid-stack-item[gs-id="value"] .signature-card {
      padding: 0.65rem 0.65rem !important;
    }
    .grid-stack-item[gs-id="value"] .signature-card .text-2xl,
    .grid-stack-item[gs-id="value"] .signature-card .text-xl,
    .grid-stack-item[gs-id="value"] .signature-card .text-base {
      font-size: calc(1.18rem * var(--ft-widget-font-scale, 1)) !important;
      line-height: 1.25 !important;
    }
  </style>
</head>
<body class="signature-bg min-h-full flex flex-col text-gray-900 dark:text-gray-100 transition-colors duration-200 pb-24 select-none">

  <!-- Mobile Top Header -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-[#131315]/90 backdrop-blur-md border-b border-gray-200/50 dark:border-white/5 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-md text-white font-mono font-bold text-sm">
        FT
      </div>
      <div>
        <span class="font-bold text-base tracking-tight text-gray-900 dark:text-white">FolioTrack</span>
        <span class="text-[9px] font-mono uppercase bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-1.5 py-0.5 rounded font-bold ml-1">Mobile</span>
      </div>
    </div>

    <!-- Theme Switch & Actions -->
    <div class="flex items-center space-x-1.5">
      <button type="button" data-pwa-install-btn onclick="window.PwaInstaller && window.PwaInstaller.promptInstall()" class="hidden p-2 rounded-full text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 active:scale-95 transition" title="Installa FolioTrack su Android">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      </button>

      <button type="button" id="mobileRefreshMarketBtn" class="p-2 rounded-full text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-500/20 active:scale-95 transition" title="Rileggi quotazioni di mercato e aggiorna subito i widget">
        <svg id="mobileRefreshMarketIcon" class="w-4 h-4 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <button type="button" id="mobileVisibilityBtn" class="p-2 rounded-full text-gray-500 dark:text-gray-400 bg-gray-100/70 dark:bg-white/5 active:scale-95 transition" title="Gestione & Visibilità Widget">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      </button>

      <button type="button" id="mobileCustomizeBtn" class="p-2 rounded-full text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-500/20 active:scale-95 transition" title="Riordina & Sposta Widget su Schermo">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
        </svg>
      </button>

      <button type="button" data-theme-toggle class="p-2 rounded-full text-gray-500 dark:text-gray-400 bg-gray-100/70 dark:bg-white/5 active:scale-95 transition" title="Cambia tema">
        <svg class="theme-icon-sun w-4 h-4 hidden text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="theme-icon-moon w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>

      <button type="button" onclick="localStorage.clear(); window.location.href='/login.html';" class="p-2 rounded-full text-gray-400 hover:text-red-500 active:scale-95 transition" title="Logout">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Customization / Reorder Active Banner (Hidden by default) -->
  <div id="customize-banner" class="hidden sticky top-[53px] z-30 bg-emerald-600 text-white px-3 py-2 flex items-center justify-between text-xs font-mono shadow-md">
    <div class="flex items-center space-x-1.5 min-w-0">
      <span class="animate-pulse w-2 h-2 rounded-full bg-white shrink-0"></span>
      <span class="truncate font-semibold text-[11px]">Riordina con frecce ▲ / ▼ o trascina</span>
    </div>
    <div class="flex items-center space-x-1.5 shrink-0">
      <button id="saveLayoutBtn" type="button" class="btn-pill px-2.5 py-1 bg-white text-emerald-800 font-bold text-xs shadow-xs active:scale-95">Salva</button>
      <button id="cancelCustomizeBtn" type="button" class="btn-pill px-2.5 py-1 bg-black/25 text-white text-xs active:scale-95">Fatto</button>
    </div>
  </div>

  <!-- Save Success Toast -->
  <div id="save-toast" class="hidden fixed bottom-20 left-4 right-4 z-50 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center justify-center space-x-2 text-xs font-mono font-semibold animate-bounce">
    <span>✓</span>
    <span>Layout mobile salvato con successo!</span>
  </div>

  <!-- Live Market Ticker -->
  <div id="live-ticker-container"></div>

  <!-- Mobile Portfolio Selector Bar -->
  <div class="px-3.5 py-1.5 bg-white/60 dark:bg-black/30 border-b border-gray-200/50 dark:border-white/5 flex items-center justify-between gap-2">
    <span class="text-xs font-bold font-mono tracking-wider uppercase text-gray-900 dark:text-white shrink-0">DASH</span>
    <select id="mDashboardPortfolioSelect" class="px-2.5 py-1 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-[#141416] text-xs font-mono text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-emerald-500">
      <option value="all">🌐 Tutti (Aggregato)</option>
    </select>
  </div>

  <!-- Mobile GridStack 2-Column Responsive Layout -->
  <main class="px-1 py-1.5">
    <div class="grid-stack grid-stack-2">
      <!-- Populated dynamically by public/dashboard.js -->
    </div>

    <!-- Desktop Switcher Link -->
    <div class="mt-3 signature-card p-3 flex items-center justify-between text-xs font-mono mx-0.5">
      <span class="text-gray-500 dark:text-gray-400">Vista Tablet / Desktop:</span>
      <a href="/?view=desktop" class="btn-pill px-3 py-1 bg-white/70 dark:bg-white/10 border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white font-medium">
        Passa a Desktop
      </a>
    </div>
  </main>

  <!-- Drawer Backdrop (Closes drawer on outside click) -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 z-40 bg-black/40 backdrop-blur-xs transition-opacity duration-300"></div>

  <!-- Customization & Visibility Drawer Panel (Slides in from the right) -->
  <div id="customize-drawer" class="fixed inset-y-0 right-0 z-50 w-full sm:w-84 bg-white dark:bg-[#1a1a1c] border-l border-gray-200 dark:border-white/10 shadow-2xl p-5 flex flex-col justify-between transform translate-x-full transition-transform duration-300 h-full max-h-screen overflow-hidden">
    <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
      <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-white/5 shrink-0">
        <div class="flex items-center space-x-2">
          <h3 class="font-bold text-sm text-gray-900 dark:text-white">Gestione Widget</h3>
          <span id="drawer-visible-count" class="text-xs font-mono font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400">18 / 18</span>
        </div>
        <button id="closeDrawerBtn" class="p-1.5 text-gray-400 hover:text-gray-900 dark:hover:text-white rounded-lg">✕</button>
      </div>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-2 font-mono shrink-0">
        Seleziona quali widget visualizzare sulla tua dashboard mobile.
      </p>

      <div class="mt-2 shrink-0 space-y-2">
        <button id="drawerStartCustomizeBtn" type="button" class="w-full py-2 px-3 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 text-xs font-mono font-semibold flex items-center justify-center space-x-1.5 active:scale-95 transition">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
          </svg>
          <span>Attiva Modalità Riordina su Schermo</span>
        </button>

        <!-- Search input for widgets -->
        <div class="relative">
          <input type="text" id="widget-search-input" placeholder="🔍 Cerca widget..." class="w-full px-3 py-1.5 pl-8 rounded-xl text-xs font-mono border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <svg class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="flex items-center justify-between pt-2.5 pb-2 text-xs font-mono shrink-0">
        <button id="drawerShowAllBtn" type="button" class="text-emerald-600 dark:text-emerald-400 hover:underline font-semibold">Mostra Tutti</button>
        <button id="drawerResetDefaultBtn" type="button" class="text-gray-500 dark:text-gray-400 hover:underline">Ripristina Default</button>
      </div>

      <!-- Scrollable Widget Checklist -->
      <div id="widget-visibility-list" class="flex-1 overflow-y-auto min-h-0 space-y-2 py-2 pr-1.5 overscroll-contain" style="max-height: calc(100vh - 280px); scrollbar-width: thin; scrollbar-color: rgba(156, 163, 175, 0.4) transparent;">
        <!-- Populated dynamically by public/dashboard.js -->
      </div>
    </div>

    <div class="pt-4 border-t border-gray-100 dark:border-white/5 space-y-2 shrink-0">
      <button id="closeDrawerFooterBtn" onclick="FolioTrackDashboard.closeDrawer()" class="btn-pill w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-md shadow-emerald-600/20">
        Fatto (Chiudi Pannello)
      </button>
      <button id="saveLayoutDrawerBtn" onclick="FolioTrackDashboard.saveLayout()" class="btn-pill w-full py-2 bg-gray-100 dark:bg-white/5 hover:bg-gray-200 dark:hover:bg-white/10 text-gray-700 dark:text-gray-300 font-medium text-xs">
        Salva Impostazioni
      </button>
    </div>
  </div>

  <!-- Floating Mobile Action Button -->
  <button type="button" id="mobileAddTxBtn" onclick="TransactionModal.open()" class="fixed right-4 bottom-20 z-40 w-12 h-12 rounded-full bg-emerald-600 text-white shadow-xl flex items-center justify-center text-2xl font-bold active:scale-90 transition shadow-emerald-600/30">
    +
  </button>

  <!-- Market Sync Notification Toast -->
  <div id="market-sync-toast" class="hidden fixed top-16 left-4 right-4 z-50 bg-gray-900/95 dark:bg-[#18181b]/95 backdrop-blur text-white px-4 py-2.5 rounded-xl shadow-2xl border border-emerald-500/30 flex items-center space-x-2.5 text-xs font-mono transition-all duration-300">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
    <span id="market-sync-toast-msg">Dati di mercato riletti: widget aggiornati</span>
  </div>

  <!-- Mobile Bottom Tab Bar -->
  <!-- MOBILE_NAV_PARTIAL -->

  <!-- Vendor Scripts (Offline ready) -->
  <script src="/vendor/gridstack/gridstack-all.js"></script>
  <script src="/vendor/chartjs/chart.umd.min.js"></script>

  <!-- Application Frontend Scripts -->
  <script src="/header_indices.js"></script>
  <script src="/transaction_modal.js"></script>
  <script src="/asset_drawer.js?v=20261109_04"></script>
  <script src="/dashboard.js?v=20261109_04"></script>
</body>
</html>
