<script>
  (function () {
    const p = window.location.pathname;
    const navLinks = document.querySelectorAll('#mobile-bottom-nav a[data-mobile-page]');
    navLinks.forEach(link => {
      const page = link.getAttribute('data-mobile-page');
      let isActive = false;
      if (page === 'dashboard' && (p === '/' || p === '/dashboard')) isActive = true;
      else if (page === 'performance' && p.startsWith('/performance')) isActive = true;
      else if (page === 'portfolios' && p.startsWith('/portfolio')) isActive = true;
      else if (page === 'transactions' && p.startsWith('/transactions')) isActive = true;
      else if (page === 'tools' && (p.startsWith('/tools') || p.startsWith('/strumenti') || p.startsWith('/analysis') || p.startsWith('/analisi') || p.startsWith('/rebalance') || p.startsWith('/ai-advisor') || p.startsWith('/reports') || p.startsWith('/goals') || p.startsWith('/dividends') || p.startsWith('/history'))) isActive = true;
      else if (page === 'settings' && p.startsWith('/settings')) isActive = true;

      if (isActive) {
        link.classList.remove('text-gray-400');
        link.classList.add('text-emerald-600', 'dark:text-emerald-400', 'font-bold');
      }
    });
  })();
</script>
