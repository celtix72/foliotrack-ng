<script>
  (function () {
    // Highlight active link based on current path
    const currentPath = window.location.pathname;
    const navItems = document.querySelectorAll('#sidebar-nav .nav-item');
    navItems.forEach(item => {
      const href = item.getAttribute('href');
      if (href && (currentPath === href || (href !== '/' && currentPath.startsWith(href)))) {
        item.classList.add('bg-emerald-500/10', 'text-emerald-600', 'dark:text-emerald-400', 'font-semibold');
        item.classList.remove('text-gray-700', 'dark:text-gray-300');
        const icon = item.querySelector('svg');
        if (icon) {
          icon.classList.add('text-emerald-600', 'dark:text-emerald-400');
          icon.classList.remove('text-gray-400');
        }
      }
    });

    // Check if on tools route (rebalance, ai-advisor, reports, goals, tools)
    const isToolsPage = currentPath.startsWith('/tools') ||
                        currentPath.startsWith('/strumenti') ||
                        currentPath.startsWith('/rebalance') ||
                        currentPath.startsWith('/ai-advisor') ||
                        currentPath.startsWith('/reports') ||
                        currentPath.startsWith('/goals');

    const toolsBtn = document.getElementById('btn-toggle-tools');
    const toolsSub = document.getElementById('nav-tools-sub');
    const toolsChevron = document.getElementById('tools-chevron');

    // Default open if on any tools page or if previously left open
    let toolsOpen = isToolsPage || localStorage.getItem('foliotrack_tools_menu_open') === 'true';
    function updateToolsAccordion() {
      if (!toolsSub || !toolsChevron) return;
      if (toolsOpen) {
        toolsSub.classList.remove('hidden');
        toolsChevron.classList.add('rotate-180');
      } else {
        toolsSub.classList.add('hidden');
        toolsChevron.classList.remove('rotate-180');
      }
    }
    updateToolsAccordion();

    if (toolsBtn) {
      toolsBtn.addEventListener('click', () => {
        toolsOpen = !toolsOpen;
        localStorage.setItem('foliotrack_tools_menu_open', toolsOpen);
        updateToolsAccordion();
      });

      if (isToolsPage) {
        toolsBtn.classList.add('bg-emerald-500/10', 'text-emerald-600', 'dark:text-emerald-400', 'font-semibold');
        toolsBtn.classList.remove('text-gray-700', 'dark:text-gray-300');
        const icon = toolsBtn.querySelector('svg');
        if (icon) {
          icon.classList.add('text-emerald-600', 'dark:text-emerald-400');
          icon.classList.remove('text-gray-400');
        }
      }
    }

    // Highlight specific sub-item
    const subItems = document.querySelectorAll('#nav-tools-sub .nav-sub-item');
    subItems.forEach(item => {
      const href = item.getAttribute('href');
      let isSubActive = false;
      if (href === '/tools' && (currentPath === '/tools' || currentPath === '/strumenti')) isSubActive = true;
      else if (href === '/rebalance' && currentPath.startsWith('/rebalance')) isSubActive = true;
      else if (href === '/ai-advisor' && (currentPath.startsWith('/ai-advisor') || currentPath.startsWith('/reports') || currentPath.startsWith('/goals'))) isSubActive = true;

      if (isSubActive) {
        item.classList.add('bg-emerald-500/15', 'text-emerald-700', 'dark:text-emerald-300', 'font-bold');
        item.classList.remove('text-gray-600', 'dark:text-gray-400');
      }
    });

    // Populate user profile if stored in localStorage
    try {
      const user = JSON.parse(localStorage.getItem('foliotrack_user') || '{}');
      if (user && user.username) {
        const usernameEl = document.getElementById('sidebar-username');
        const avatarEl = document.getElementById('user-avatar');
        if (usernameEl) usernameEl.textContent = user.username;
        if (avatarEl) avatarEl.textContent = user.username.charAt(0).toUpperCase();
      }
    } catch {}

    // Logout button handler
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        try {
          await fetch('/api/auth/logout', { method: 'POST' });
        } finally {
          localStorage.removeItem('foliotrack_jwt');
          localStorage.removeItem('foliotrack_user');
          window.location.href = '/login.html';
        }
      });
    }
  })();
</script>
